version: '3.8'

services:
   mysql:
     image: mysql:8.0
     ports:
      - "3307:3306"
     environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: pass
     volumes:
      - mysql_data:/var/lib/mysql
   gate-simulator:
     image: node:18-alpine
     working_dir: /app
     volumes:
      - ./gate-simulator:/app
     ports:
       - '9999:9999'
     command: sh -c "npm install && npm start"
   aqa-shop:
     image: eclipse-temurin:11-jre
     working_dir: /app
     volumes:
       - ./aqa-shop.jar:/app/aqa-shop.jar
       - ./application.properties:/app/application.properties
     ports:
       - "8080:8080"
     depends_on:
       - mysql
       - gate-simulator
     command: >
       java -jar aqa-shop.jar
       --spring.datasource.url=jdbc:mysql://mysql:3306/app
       --spring.credit-gate.url=http://gate-simulator:9999/credit
       --spring.payment-gate.url=http://gate-simulator:9999/payment
volumes:
  mysql_data: